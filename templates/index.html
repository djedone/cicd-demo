<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CI/CD Cloud Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 14px;
        }
        .badge {
            margin-top: 20px;
            display: inline-block;
            padding: 6px 12px;
            background: #2ecc71;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CI/CD Cloud Demo</h1>
        <p>Automated build, test and deployment pipeline</p>
        <div class="badge">Service is running</div>
    </div>
</body>
</html>
