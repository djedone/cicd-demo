stages:
  - test
  - security
  - build
  - deploy

variables:
  POSTGRES_DB: cicd_demo_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass
  POSTGRES_HOST_AUTH_METHOD: trust

services:
  - postgres:15

test:
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update -y && apt-get install -y gcc python3-dev
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m pytest --cov=app --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - main
    - develop
    - merge_requests

security:
  stage: security
  image: python:3.9-slim
  before_script:
    - apt-get update -y && apt-get install -y gcc python3-dev
    - python -m pip install --upgrade pip
    - pip install bandit safety
  script:
    - bandit -r app/ -f json -o bandit-report.json || true
    - safety check --json --output safety-report.json || true
  artifacts:
    reports:
      junit: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
  only:
    - main
    - develop
    - merge_requests

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker build -t cicd-demo:$CI_COMMIT_SHA .
    - docker tag cicd-demo:$CI_COMMIT_SHA cicd-demo:latest
  only:
    - main
    - develop

deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$RENDER_STAGING_DEPLOY_HOOK" ]; then
        echo "Deploying to staging environment..."
        curl -X POST "$RENDER_STAGING_DEPLOY_HOOK"
      else
        echo "RENDER_STAGING_DEPLOY_HOOK not set. Skipping staging deployment."
      fi
  only:
    - develop
  environment:
    name: staging
    url: https://cicd-demo-staging-1s8u.onrender.com/

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$RENDER_PROD_DEPLOY_HOOK" ]; then
        echo "Deploying to production environment..."
        curl -X POST "$RENDER_PROD_DEPLOY_HOOK"
      else
        echo "RENDER_PROD_DEPLOY_HOOK not set. Skipping production deployment."
      fi
  only:
    - main
  environment:
    name: production
    url: https://cicd-demo-e71o.onrender.com/
  when: manual