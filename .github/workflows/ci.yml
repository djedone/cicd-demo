name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t cicd-demo .

    - name: Run container test
      run: |
        docker run -d -p 5000:5000 cicd-demo
        sleep 5
        curl http://localhost:5000
