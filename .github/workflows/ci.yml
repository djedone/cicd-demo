# .github/workflows/ci.yml
name: CI/CD Pipeline with Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cicd_demo_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Linter checks - Flake8
      - name: Linter checks - Flake8
        run: |
          flake8 --version
          flake8 app/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      # 5. Linter checks - Pylint
      - name: Linter checks - Pylint
        run: |
          pylint --version
          pylint app/ tests/ scripts/ --disable=C0114,C0115,R0903 || true  # Don't fail on warnings

      # 6. Code formatting check - Black
      - name: Code formatting check - Black
        run: |
          black --version
          black --check app/ tests/ scripts/

      # 7. Import sorting check - isort
      - name: Import sorting check - isort
        run: |
          isort --version
          isort --check-only app/ tests/ scripts/

      # 8. Run security checks
      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Run Safety dependency check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      # 9. Run automated functional tests
      - name: Run automated tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/cicd_demo_test
        run: |
          python -m pytest --cov=app --cov-report=xml

      # 10. Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

      # 11. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t cicd-demo:${{ github.sha }} .

      # 12. Security scan of Docker image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cicd-demo:${{ github.sha }}
          severity: CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: 1

      # 13. Run performance tests (Locust)
      - name: Run performance tests
        run: |
          pip install locust
          # Start app in background and run basic load test
          python -m app.main &
          sleep 10
          locust --headless -u 10 -r 1 --run-time 30s --host=http://localhost:5000 || true