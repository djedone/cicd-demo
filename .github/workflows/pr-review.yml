name: PR Review Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-review-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check PR description
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          if (!pr.body || pr.body.length < 50) {
            core.setFailed('PR description must be at least 50 characters long');
          }
          
          // Check for required sections
          const requiredSections = ['## Changes', '## Testing', '## Checklist'];
          const missingSections = requiredSections.filter(section => !pr.body.includes(section));
          
          if (missingSections.length > 0) {
            core.setFailed(`PR description must include: ${missingSections.join(', ')}`);
          }
    
    - name: Check for breaking changes
      run: |
        if git diff --name-only origin/main...HEAD | grep -E "(requirements\.txt|dockerfile|\.github/workflows/)"; then
          echo "::warning::Breaking changes detected in infrastructure files"
        fi
    
    - name: Run linter checks
      run: |
        flake8 app/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check app/ tests/ scripts/
        isort --check-only app/ tests/ scripts/
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        TESTING: true
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Add PR labels
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          const labels = [];
          
          // Add size label based on files changed
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          if (files.length <= 5) {
            labels.push('size/S');
          } else if (files.length <= 15) {
            labels.push('size/M');
          } else {
            labels.push('size/L');
          }
          
          // Add type labels based on files
          const fileNames = files.map(f => f.filename);
          
          if (fileNames.some(f => f.includes('requirements.txt') || f.includes('dockerfile'))) {
            labels.push('type/infrastructure');
          }
          
          if (fileNames.some(f => f.includes('test'))) {
            labels.push('type/tests');
          }
          
          if (fileNames.some(f => f.includes('app/'))) {
            labels.push('type/code');
          }
          
          if (fileNames.some(f => f.includes('.md'))) {
            labels.push('type/documentation');
          }
          
          // Add labels
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: labels
          });
    
    - name: Request reviewers
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          // Don't request reviewers for draft PRs
          if (pr.draft) {
            return;
          }
          
          // Request reviewers based on files changed
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          const fileNames = files.map(f => f.filename);
          let reviewers = [];
          
          // Define reviewer mapping
          const reviewerMapping = {
            'type/infrastructure': ['dedovic'], // Change to actual reviewer
            'type/code': ['dedovic'],
            'type/tests': ['dedovic'],
            'type/documentation': ['dedovic']
          };
          
          // Determine reviewers based on file types
          if (fileNames.some(f => f.includes('requirements.txt') || f.includes('dockerfile'))) {
            reviewers = reviewers.concat(reviewerMapping['type/infrastructure']);
          }
          
          if (fileNames.some(f => f.includes('app/'))) {
            reviewers = reviewers.concat(reviewerMapping['type/code']);
          }
          
          if (fileNames.some(f => f.includes('test'))) {
            reviewers = reviewers.concat(reviewerMapping['type/tests']);
          }
          
          // Remove duplicates
          reviewers = [...new Set(reviewers)];
          
          if (reviewers.length > 0) {
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: reviewers
            });
          }
    
    - name: Comment on PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          const comment = `
          ## 🤖 Automated PR Review
          
          ### 📊 Statistics
          - **Files changed**: ${files.length}
          - **Additions**: ${files.reduce((sum, f) => sum + f.additions, 0)}
          - **Deletions**: ${files.reduce((sum, f) => sum + f.deletions, 0)}
          
          ### 🔍 Automated Checks
          - [x] Code formatting (Black)
          - [x] Import sorting (isort)
          - [x] Linting (Flake8)
          - [x] Tests passing
          - [x] Security scan
          
          ### 📋 Next Steps
          1. Review the automated test results
          2. Check the code coverage report
          3. Verify the security scan results
          4. Manual review by team members
          
          ### 🚀 Ready to Merge
          This PR will be ready to merge once:
          - [ ] All automated checks pass
          - [ ] At least one human approval
          - [ ] No merge conflicts
          `;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: comment
          });
