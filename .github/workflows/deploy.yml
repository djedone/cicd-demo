# .github/workflows/deploy.yml
name: Deploy to Environments

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          if [ -n "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render staging deployment..."
            curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
          else
            echo "RENDER_STAGING_DEPLOY_HOOK secret not configured"
            echo "Please configure the deploy hook in GitHub repository secrets"
            echo "Deployment will be skipped but pipeline continues"
          fi

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-staging]
    steps:
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ secrets.APPROVERS }}
          minimum-approvers: 1
          
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render production deployment..."
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            echo "RENDER_PROD_DEPLOY_HOOK secret not configured"
            echo "Please configure the deploy hook in GitHub repository secrets"
            echo "Deployment will be skipped but pipeline continues"
          fi