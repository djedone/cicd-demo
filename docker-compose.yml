version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cicd_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://demo_user:demo_pass@db:5432/cicd_demo
    depends_on:
      - db

volumes:
  postgres_data: