# Prometheus Alerting Rules for CI/CD Demo
groups:
  - name: cicd-demo.rules
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="cicd-demo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CI/CD Demo application is down"
          description: "CI/CD Demo application has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(flask_http_request_exceptions_total{job="cicd-demo"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second."

      - alert: HighResponseTime
        expr: flask_http_request_duration_seconds{quantile="0.95", job="cicd-demo"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds."

      - alert: DatabaseConnectionFailed
        expr: flask_database_connections_active{job="cicd-demo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failed"
          description: "No active database connections detected."

      # Deployment Alerts
      - alert: DeploymentFailureRate
        expr: rate(deployment_failures_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High deployment failure rate"
          description: "Deployment failure rate is {{ $value | humanizePercentage }}."

      - alert: NoRecentDeployments
        expr: time() - deployment_last_timestamp > 86400
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "No recent deployments"
          description: "No deployments in the last 24 hours."

      # Resource Alerts
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}MB."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%."

      # Business Metrics Alerts
      - alert: LowDeploymentSuccessRate
        expr: deployment_success_rate < 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low deployment success rate"
          description: "Deployment success rate is {{ $value }}%."

      - alert: UnusualActivitySpike
        expr: rate(flask_http_request_total[5m]) > 100
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "Unusual activity spike"
          description: "Request rate is {{ $value }} requests per second."

  - name: infrastructure.rules
    rules:
      # Infrastructure Alerts
      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Nginx high error rate"
          description: "Nginx 5xx error rate is {{ $value | humanizePercentage }}."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL has {{ $value }} active connections."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low"
          description: "Disk space is {{ $value }}% full."
